on:
  push:
  pull_request:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-
      - name: Install development dependencies
        run: shards install
      - name: Make sure the files are formatted
        run: crystal tool format --check
      - name: Run lint
        run: make lint
      - name: Install build deps
        run: sudo apt-get install -y cmake libpng-dev zlib1g-dev
      - name: Ensure libharu >= 2.4.6
        run: make libharu
      - name: Compile check
        run: crystal build src/hpdf.cr -o /tmp/hpdf_check --no-codegen

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-
      - name: Install development dependencies
        run: shards install
      - name: Install build deps
        run: sudo apt-get install -y cmake libpng-dev zlib1g-dev
      - name: Ensure libharu >= 2.4.6
        run: make libharu
      - name: Run examples
        run: make examples
      - name: Run tests
        run: make spec

  verify-macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install libharu / crystal
        run: brew install libharu crystal libpng cmake
      - name: Install development dependencies
        run: shards install
      - name: Ensure libharu >= 2.4.6
        run: make libharu
      - name: Run lint
        run: make lint
      - name: Run tests
        run: make examples spec
