on:
  push:
  pull_request:
    branches: [master]
jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install build deps
        run: sudo apt-get install -y cmake libpng-dev zlib1g-dev
      - name: Ensure libharu >= 2.4.6
        run: make libharu
      - name: Install development dependencies
        run: shards install
      - name: Run tests
        run: make lint spec
      - name: Run examples
        run: make examples
      - name: Make sure the files are formatted
        run: crystal tool format --check

  verify-macos:
    runs-on: macos-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install libharu / crystal
        run: brew install libharu crystal libpng cmake
      - name: Ensure libharu >= 2.4.6
        run: make libharu
      - name: Run tests
        run: make examples spec
